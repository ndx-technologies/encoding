name: test

on: [push]

permissions: read-all

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v4

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version: ^1.27

      - name: test
        run: go test -coverprofile=coverage.out -covermode=atomic -cover ./...

      - name: fuzz
        run: |
          go test ./base64 -list . | grep Fuzz | xargs -P 8 -I {} go test -fuzz {} -fuzztime 15s ./base64
